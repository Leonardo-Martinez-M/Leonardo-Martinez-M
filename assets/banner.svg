<svg viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Leonardo Martinez M. - Backend Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="280" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#d8dee9" opacity="0.7">
    <circle cx="540" cy="40" r="1.2"/>
    <circle cx="610" cy="75" r="1"/>
    <circle cx="690" cy="30" r="1.4"/>
    <circle cx="960" cy="110" r="1.2"/>
    <circle cx="570" cy="130" r="1"/>
    <circle cx="930" cy="35" r="1"/>
    <circle cx="120" cy="40" r="1"/>
    <circle cx="380" cy="55" r="1.2"/>
  </g>

  <!-- crescent moon -->
  <circle cx="860" cy="70" r="28" fill="#d8dee9" opacity="0.92"/>
  <circle cx="872" cy="62" r="26" fill="#10111a"/>

  <!-- castle silhouette -->
  <g fill="#07070b" stroke="#2a2c3d" stroke-width="1.5">
    <!-- curtain wall -->
    <rect x="640" y="215" width="330" height="65"/>
    <!-- left tower -->
    <rect x="660" y="140" width="50" height="140"/>
    <polygon points="652,140 685,85 718,140"/>
    <!-- keep -->
    <rect x="770" y="110" width="100" height="170"/>
    <polygon points="762,110 820,40 878,110"/>
    <!-- right tower -->
    <rect x="920" y="150" width="50" height="130"/>
    <polygon points="912,150 945,100 978,150"/>
  </g>

  <!-- battlements -->
  <line x1="640" y1="211" x2="970" y2="211" stroke="#07070b" stroke-width="8" stroke-dasharray="12 12"/>

  <!-- spire cross -->
  <g stroke="#2a2c3d" stroke-width="2" fill="none">
    <line x1="820" y1="40" x2="820" y2="20"/>
    <line x1="814" y1="27" x2="826" y2="27"/>
  </g>

  <!-- gothic windows -->
  <g fill="#e5c07b" opacity="0.8">
    <path d="M815 170 V152 Q820 140 825 152 V170 Z"/>
    <path d="M680 195 V180 Q685 170 690 180 V195 Z"/>
    <path d="M940 205 V190 Q945 180 950 190 V205 Z"/>
    <path d="M685 130 V122 Q689 116 693 122 V130 Z" opacity="0.6"/>
  </g>

  <!-- gate -->
  <path d="M805 280 V248 Q820 228 835 248 V280 Z" fill="#0f1018" stroke="#2a2c3d" stroke-width="1.5"/>

  <!-- title -->
  <text x="50" y="140" font-family="Cinzel, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="30" letter-spacing="3" fill="#d8dee9">LEONARDO MARTÍNEZ M.</text>
  <line x1="52" y1="156" x2="300" y2="156" stroke="#81a1c1" stroke-width="1"/>
  <text x="50" y="186" font-family="Cinzel, 'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="14" letter-spacing="4" fill="#81a1c1">BACKEND SOFTWARE ENGINEER</text>
</svg>
